
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ケーキ屋さん</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#shop {
    width: 1000px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background-image: url("background/cake-background.png");
    background-size: 100% 100%;
    background-position: center;
}

/* ケーキを並べる棚 */
.shelf {
    position: absolute;
    left: 10%;
    width: 80%;
    height: 15%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    align-items: end;
    justify-items: center;
}

/* ケーキ画像 */
.shelf img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* 3段の位置 */
#topShelf {
    top: 22%;
}

#middleShelf {
    top: 44%;
}

#bottomShelf {
    top: 66%;
}

/* ケーキを作るボタン */
#drawButton {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 10;
    padding: 10px 16px;
    border: 2px solid white;
    border-radius: 20px;
    background: #e879a9;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="shop">

    <div class="shelf" id="topShelf"></div>

    <div class="shelf" id="middleShelf"></div>

    <div class="shelf" id="bottomShelf"></div>

    <button id="drawButton"
        onclick="location.href='draw.html'">
        けーきをつくる
    </button>

</div>

<script>

// ローカルのケーキ画像15枚を読み込む
for (let i = 1; i <= 15; i++) {

    const cake = document.createElement("img");

    const number = String(i).padStart(2, "0");

    cake.src = "cake/cake" + number + ".png";

    cake.alt = "ケーキ" + i;

    cake.onerror = function() {
        console.error("画像が見つかりません:", cake.src);
    };

    if (i <= 5) {
        document.getElementById("topShelf").appendChild(cake);
    }
    else if (i <= 10) {
        document.getElementById("middleShelf").appendChild(cake);
    }
    else {
        document.getElementById("bottomShelf").appendChild(cake);
    }
}

</script>

</body>
</html>
